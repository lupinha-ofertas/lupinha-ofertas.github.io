name: Stories e Achados do dia
# Pacote do dia: arte de story de cada achado (com link), 5 posts do feed, planilhas,
# página "Posts do dia" (/posts/) e página "Achados do dia" (/achados/).
# Imagens e o .zip ficam públicos no branch "midia" (só o dia de hoje; é refeito todo dia).
# Roda sozinho quando o robô publica a lista do dia (enviar/ na main), por volta das 5h-7h.
# Trava: a primeira execução do dia vale. Se a lista mudar depois, artes, planilha e
# numeração da página NÃO mudam (para bater com os stories já agendados).
# Para refazer mesmo assim: Actions > Stories e Achados do dia > Run workflow > refazer = sim.
# Na branch stories-fase1 roda como prévia: gera tudo, mas NÃO publica a página nem trava.
on:
  push:
    branches: [main, stories-fase1]
    paths: [enviar/index.html, enviar/dados.json, stories/**, .github/workflows/stories-diario.yml]
  workflow_dispatch:
    inputs:
      refazer:
        description: "Refazer hoje mesmo já tendo gerado (muda artes e números!)"
        type: boolean
        default: false
concurrency: { group: stories-diario, cancel-in-progress: false }
permissions: { contents: write }
env: { TZ: America/Sao_Paulo }
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trava do dia
        id: trava
        run: |
          hoje=$(date +%F)
          echo "hoje=$hoje" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then echo "ramo=midia" >> "$GITHUB_OUTPUT"; else echo "ramo=midia-previa" >> "$GITHUB_OUTPUT"; fi
          if [ "${{ github.ref }}" = "refs/heads/main" ] && grep -q "\"$hoje\"" achados/dia.json 2>/dev/null \
             && [ "${{ inputs.refazer }}" != "true" ]; then
            echo "pronto=sim" >> "$GITHUB_OUTPUT"
            echo "### Já gerado hoje ($hoje): nada mudou. As artes estão na primeira execução do dia." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.trava.outputs.pronto != 'sim'
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: steps.trava.outputs.pronto != 'sim'
        # Se o espelho do Ubuntu falhar (já aconteceu em 19/11), instala só o navegador: o runner já tem as libs do Chrome.
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium || python -m playwright install chromium
      - name: Artes (stories + feed) e planilhas
        if: steps.trava.outputs.pronto != 'sim'
        run: python stories/gerar_artes.py --ramo-midia ${{ steps.trava.outputs.ramo }}
      - name: Página Achados do dia
        if: steps.trava.outputs.pronto != 'sim'
        run: |
          python stories/gerar_pagina.py
          python stories/gerar_posts.py --ramo-midia ${{ steps.trava.outputs.ramo }}
          python -c "import json,sys; json.dump({'data': sys.argv[1], 'numeracao': json.load(open('stories/saida/numeracao.json'))}, open('achados/dia.json','w'))" "${{ steps.trava.outputs.hoje }}"
      - name: Montar o .zip do dia
        if: steps.trava.outputs.pronto != 'sim'
        run: |
          d=stories/saida
          mkdir -p pacote/stories pacote/feed
          cp $d/artes/*.png pacote/stories/ 2>/dev/null || true
          cp $d/feed/*.jpg pacote/feed/ 2>/dev/null || true
          cp $d/agendar-stories.csv pacote/stories.csv
          cp $d/agendar-feed.csv pacote/feed.csv
          (cd pacote && zip -qr ../posts-do-dia.zip .)
      - name: Publicar imagens e .zip no branch ${{ steps.trava.outputs.ramo }}
        if: steps.trava.outputs.pronto != 'sim'
        run: |
          rm -rf /tmp/midia && mkdir /tmp/midia && cd /tmp/midia
          cp -r "$GITHUB_WORKSPACE/pacote/stories" "$GITHUB_WORKSPACE/pacote/feed" .
          cp "$GITHUB_WORKSPACE/posts-do-dia.zip" "$GITHUB_WORKSPACE/stories/saida/feed.json" .
          git init -q -b "${{ steps.trava.outputs.ramo }}"
          git config user.name "lupinha-robo-stories"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Posts de ${{ steps.trava.outputs.hoje }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:${{ steps.trava.outputs.ramo }}"
      - name: Guardar o pacote (baixe em Actions > esta execução > Artifacts)
        if: steps.trava.outputs.pronto != 'sim'
        uses: actions/upload-artifact@v4
        with:
          name: posts-${{ steps.trava.outputs.hoje }}
          path: |
            posts-do-dia.zip
            posts/index.html
            achados/index.html
          retention-days: 30
      - name: Publicar as páginas e travar o dia (só na main)
        if: steps.trava.outputs.pronto != 'sim' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "lupinha-robo-stories"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add achados/index.html achados/ontem/index.html achados/dia.json posts/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Achados e posts do dia ${{ steps.trava.outputs.hoje }}"
          git pull --rebase origin main && git push origin HEAD:main
