name: Testar fotos (manual)
on:
  workflow_dispatch:
  push:
    branches: [stories-fase1]
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python stories/testar_fotos.py >> "$GITHUB_STEP_SUMMARY"
