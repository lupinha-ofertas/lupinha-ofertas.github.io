name: Testar fotos Amazon (manual)
on:
  workflow_dispatch:
  push:
    branches: [stories-fase1]
    paths: [stories/testar_amazon.py, .github/workflows/testar-amazon.yml]
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python stories/testar_amazon.py | tee -a "$GITHUB_STEP_SUMMARY"
