<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lupinha da Ari · Achadinhos</title>
<meta name="description" content="Achadinhos da Shopee testados e com preço bom: vitrine, grupo de ofertas no WhatsApp e Instagram.">
<meta property="og:title" content="Lupinha da Ari · Achadinhos">

<meta name="theme-color" content="#C8435A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23C8435A'/%3E%3Ccircle cx='45' cy='44' r='22' fill='%23FDF3EA'/%3E%3Cline x1='60' y1='59' x2='74' y2='73' stroke='%23FDF3EA' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{--coral:#C8435A;--coral-dark:#A9354A;--cream:#FDF3EA;--green:#1F9D4E;--ink:#4A1F2A}
  *{box-sizing:border-box;margin:0}
  html,body{min-height:100%}
  body{background:var(--coral);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
       background-image:radial-gradient(circle at 100% 0,rgba(255,255,255,.08) 0 220px,transparent 221px),radial-gradient(circle at 0 100%,rgba(255,255,255,.07) 0 260px,transparent 261px);
       background-attachment:fixed;display:flex;justify-content:center;padding:48px 16px 32px}
  main{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .logo{width:116px;height:116px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;box-shadow:0 14px 34px rgba(70,10,25,.25)}
  h1{font-size:34px;font-weight:800;letter-spacing:-.02em;margin-top:18px;line-height:1}
  .tag{font-size:13px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;opacity:.9;margin-top:8px}
  .bio{font-size:16px;line-height:1.45;margin-top:14px;opacity:.95;max-width:340px}
  nav{width:100%;display:flex;flex-direction:column;gap:14px;margin-top:28px}
  a.btn{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:18px;text-decoration:none;background:var(--cream);color:var(--ink);
        font-weight:700;font-size:17px;box-shadow:0 6px 0 var(--coral-dark);transition:transform .12s ease,box-shadow .12s ease;text-align:left}
  a.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--coral-dark)}
  a.btn small{display:block;font-weight:500;font-size:13px;opacity:.75;margin-top:2px}
  a.btn .ico{flex:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
  a.btn .txt{flex:1}
  a.btn .arrow{flex:none;opacity:.5;font-size:20px}
  a.wpp{background:var(--green);color:#fff;box-shadow:0 6px 0 #15723A}
  a.wpp:active{box-shadow:0 2px 0 #15723A}
  a.wpp .ico{background:rgba(255,255,255,.18)}
  .ico.shop{background:#FCE3E7}
  .ico.ig{background:#F7E3DC}
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">
    <svg width="78" height="78" viewBox="0 0 100 100">
      <line x1="62" y1="62" x2="86" y2="86" stroke="#C8435A" stroke-width="13" stroke-linecap="round"/>
      <circle cx="42" cy="42" r="34" fill="#C8435A"/>
      <path transform="translate(42,30) scale(.3)" d="M0 35 C0 0 -50 -10 -50 25 C-50 55 -15 75 0 90 C15 75 50 55 50 25 C50 -10 0 0 0 35Z" fill="#FDF3EA"/>
    </svg>
  </div>
  <h1>lupinha da Ari</h1>
  <div class="tag">achadinhos</div>
  <p class="bio">Achadinhos da Shopee testados e com preço bom 🔍 casa, limpeza e beleza</p>

  <nav>
    <a class="btn wpp" href="https://chat.whatsapp.com/Fl8ZN3TRzsIIQzU14YQ35u" target="_blank" rel="noopener">
      <span class="ico">💬</span>
      <span class="txt">Grupo de ofertas no WhatsApp<small>ofertas todo dia · sem spam</small></span>
      <span class="arrow">›</span>
    </a>
    <a class="btn" href="https://collshp.com/lupinhadaari?view=storefront" target="_blank" rel="noopener">
      <span class="ico shop">🛍️</span>
      <span class="txt">Minha vitrine na Shopee<small>todos os achadinhos que eu indico</small></span>
      <span class="arrow">›</span>
    </a>
    <a class="btn" href="https://www.instagram.com/lupinhadaari/" target="_blank" rel="noopener">
      <span class="ico ig">📸</span>
      <span class="txt">Instagram @lupinhadaari<small>reels e dicas da casa</small></span>
      <span class="arrow">›</span>
    </a>
  </nav>

</main>
</body>
</html>
